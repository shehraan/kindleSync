[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobosync"
version = "0.1.0"
description = "Free local Kobo reading-to-audiobook morning handoffs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2", "av>=11,<17"]
speech = ["piper-tts==1.8.0"]
browser = ["playwright==1.64.1", "Pillow>=11,<14"]
dev = ["lupa>=2,<3"]

[project.scripts]
kobosync = "kobosync.cli:main"

[tool.setuptools.packages.find]
include = ["kobosync*"]
